<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Маджонг Черепаха</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Golos+Text:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&text=%E4%B8%80%E4%BA%8C%E4%B8%89%E5%9B%9B%E4%BA%94%E5%85%AD%E4%B8%83%E5%85%AB%E4%B9%9D%E4%B8%87%E4%B8%9C%E5%8D%97%E8%A5%BF%E5%8C%97%E4%B8%AD%E5%8F%91%E6%A2%85%E5%85%B0%E8%8F%8A%E7%AB%B9%E6%98%A5%E5%A4%8F%E7%A7%8B%E5%86%AC%E9%BA%BB&display=block">
<style>
/* Layout: a single-screen game table. Slim header with seal + stats, the board fills the rest, toolbar under it. */
:root{
  --bg:#dde4d8; --bg2:#cfd8c9; --fg:#1d2721; --muted:#5b6a60; --accent:#b23f2a; --accent-soft:#f3d6cc;
  --line:#b9c5b4; --btn:#f3f5ef; --btn-fg:#1d2721;
  --tile:#f7f2e4; --tile-edge:#e0d5b9; --tile-back:#2e6a53; --tile-shade:rgba(30,45,35,.28);
  --t-red:#b8322a; --t-green:#1f7a4a; --t-blue:#24448f; --t-ink:#1b2333; --t-iv:#f7f2e4;
  --sel:#f6d5c8; --hint:#cfe8d6;
  --f-display:"Cormorant Garamond", "Times New Roman", serif;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-tile:"Ma Shan Zheng", "Songti SC", "STKaiti", "KaiTi", "Noto Serif SC", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#122019; --bg2:#0d1813; --fg:#e3e9e1; --muted:#93a399; --accent:#e46b50; --accent-soft:#4a2a22;
  --line:#2c3e33; --btn:#1b2c23; --btn-fg:#e3e9e1;
  --tile:#ece4cf; --tile-edge:#c9bc9a; --tile-back:#3d8a6b; --tile-shade:rgba(0,0,0,.55);
  --sel:#f1c4b3; --hint:#bfe3c9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#122019; --bg2:#0d1813; --fg:#e3e9e1; --muted:#93a399; --accent:#e46b50; --accent-soft:#4a2a22;
  --line:#2c3e33; --btn:#1b2c23; --btn-fg:#e3e9e1;
  --tile:#ece4cf; --tile-edge:#c9bc9a; --tile-back:#3d8a6b; --tile-shade:rgba(0,0,0,.55);
  --sel:#f1c4b3; --hint:#bfe3c9; color-scheme:dark}

html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 40%, var(--bg) 0%, var(--bg2) 100%) fixed, var(--bg);color:var(--fg);font-family:var(--f-ui);
  display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:12px}
.seal{width:40px;height:40px;background:var(--accent);color:#fbefe6;border-radius:6px;display:grid;place-items:center;
  font-family:var(--f-tile);font-size:30px;line-height:1;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,3.4vw,36px);margin:0;letter-spacing:.01em;line-height:1}
h1 em{font-style:italic;color:var(--muted);font-size:.62em;margin-left:6px}
.stats{display:flex;gap:22px;margin-left:auto;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.stat b{font-size:20px;font-weight:600;line-height:1.1}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

main{flex:1;min-height:0;position:relative;display:grid;place-items:center}
#board{position:relative}
.tile{position:absolute;border-radius:calc(var(--w) * .1);background:var(--tile);cursor:pointer;
  box-shadow:
    calc(var(--d) * .35) calc(var(--d) * .35) 0 var(--tile-edge),
    calc(var(--d) * .7) calc(var(--d) * .7) 0 var(--tile-edge),
    var(--d) var(--d) 0 var(--tile-back),
    calc(var(--d) * 1.3) calc(var(--d) * 1.5) calc(var(--d) * 1.6) var(--tile-shade);
  transition:opacity .22s ease, transform .22s ease, filter .2s ease, background-color .15s}
.tile svg{position:absolute;inset:6% 7%;width:86%;height:88%;overflow:visible;pointer-events:none}
.tile.sel{background:var(--sel);transform:translate(-2px,-3px)}
.tile.hint{animation:pulse .9s ease-in-out 3}
@keyframes pulse{50%{background:var(--hint);transform:translate(-1px,-3px)}}
.tile.gone{opacity:0;transform:scale(.85) translateY(-8px);pointer-events:none}
.tile.out{display:none}
.dim .tile.blocked{filter:brightness(.78) saturate(.7)}
.tile.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

.r{fill:var(--t-red)} .g{fill:var(--t-green)} .b{fill:var(--t-blue)} .k{fill:var(--t-ink)} .iv{fill:var(--t-iv)}
.gl{font-family:var(--f-tile)} .ix{font-family:var(--f-ui);font-weight:600}

footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding-block:8px 14px}
button{font:500 14px/1 var(--f-ui);color:var(--btn-fg);background:var(--btn);border:1px solid var(--line);border-radius:999px;
  padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s}
button:hover{border-color:var(--fg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default;border-color:var(--line)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button kbd{font:600 11px var(--f-ui);opacity:.55}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}

.banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:20000;background:var(--btn);border:1px solid var(--line);
  border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;
  box-shadow:0 10px 30px rgba(0,0,0,.18);max-width:calc(100% - 16px);font-size:15px}
.overlay{position:fixed;inset:0;z-index:30000;display:grid;place-items:center;background:rgba(10,20,15,.45);padding:16px}
.card{background:var(--btn);color:var(--fg);border-radius:18px;padding:28px 30px;text-align:center;max-width:360px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.card h2{font-family:var(--f-display);font-size:40px;margin:6px 0 4px;font-weight:600}
.card p{margin:6px 0;color:var(--muted);font-variant-numeric:tabular-nums}
.card .big{font-size:28px;color:var(--fg);font-weight:600}
.card .row{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}

@media (max-width:640px){
  header{gap:10px}
  .stats{gap:14px;margin-left:0;width:100%;justify-content:space-between}
  .stat{align-items:flex-start}
  .stat b{font-size:17px}
  button{padding:9px 12px;font-size:13px}
  button kbd{display:none}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile.hint,.tile.shake{animation:none}.tile.hint{background:var(--hint)}}
</style>
</head>
<body>

<header>
  <div class="brand"><div class="seal" aria-hidden="true">麻</div><h1>Маджонг<em>черепаха</em></h1></div>
  <div class="stats">
    <div class="stat"><b id="sLeft">144</b><span>Фишек</span></div>
    <div class="stat"><b id="sMoves">0</b><span>Пар доступно</span></div>
    <div class="stat"><b id="sTime">0:00</b><span>Время</span></div>
    <div class="stat"><b id="sBest">—</b><span>Рекорд</span></div>
  </div>
</header>
<main id="main"><div id="board"></div></main>
<footer>
  <button id="bHint">Подсказка <kbd>H</kbd></button>
  <button id="bUndo">Отменить <kbd>Z</kbd></button>
  <button id="bShuffle">Перемешать</button>
  <button id="bDim" class="toggle" aria-pressed="true">Затенять закрытые</button>
  <button id="bNew" class="primary">Новая игра</button>
</footer>

<script>
(() => {
// ---------- Layout: classic "Turtle", coordinates in half-tile units ----------
const P = [];
const add = (x, y, z) => P.push({ x: Math.round(x * 2), y: Math.round(y * 2), z });
[[1,12],[3,10],[2,11],[1,12],[1,12],[2,11],[3,10],[1,12]].forEach(([a,b], y) => { for (let x = a; x <= b; x++) add(x, y, 0); });
add(0, 3.5, 0); add(13, 3.5, 0); add(14, 3.5, 0);
for (let y = 1; y <= 6; y++) for (let x = 4; x <= 9; x++) add(x, y, 1);
for (let y = 2; y <= 5; y++) for (let x = 5; x <= 8; x++) add(x, y, 2);
for (let y = 3; y <= 4; y++) for (let x = 6; x <= 7; x++) add(x, y, 3);
add(6.5, 3.5, 4);
const N = P.length; // 144

const ABOVE = [], LEFT = [], RIGHT = [];
for (let i = 0; i < N; i++) {
  ABOVE[i] = []; LEFT[i] = []; RIGHT[i] = [];
  for (let j = 0; j < N; j++) {
    if (i === j) continue;
    const dx = P[j].x - P[i].x, dy = P[j].y - P[i].y;
    if (Math.abs(dy) >= 2) continue;
    if (P[j].z === P[i].z + 1 && Math.abs(dx) < 2) ABOVE[i].push(j);
    if (P[j].z === P[i].z) { if (dx === -2) LEFT[i].push(j); if (dx === 2) RIGHT[i].push(j); }
  }
}
const isFree = (i, pr) => pr[i] && ABOVE[i].every(j => !pr[j]) && (LEFT[i].every(j => !pr[j]) || RIGHT[i].every(j => !pr[j]));

// ---------- Tile set ----------
const KINDS = [];
for (const s of ['d','b','c']) for (let n = 1; n <= 9; n++) KINDS.push(s + n);
['wE','wS','wW','wN','dr','dg','dw'].forEach(k => KINDS.push(k));
const group = f => f[0] === 'f' || f[0] === 's' ? f[0] : f;
function fullPairs() {
  const pairs = [];
  KINDS.forEach(k => { pairs.push([k,k], [k,k]); });
  pairs.push(['f1','f2'], ['f3','f4'], ['s1','s2'], ['s3','s4']);
  return pairs;
}
const rnd = n => Math.floor(Math.random() * n);
const shuffleArr = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// Deal by reverse play: remove free pairs of positions from the filled shape, assigning matching faces. Always solvable.
function deal(indices, pairs) {
  for (let attempt = 0; attempt < 400; attempt++) {
    const pr = new Array(N).fill(false); indices.forEach(i => pr[i] = true);
    const ps = shuffleArr(pairs.slice()), faces = {};
    let ok = true;
    for (let k = 0; k < ps.length; k++) {
      const free = indices.filter(i => isFree(i, pr));
      if (free.length < 2) { ok = false; break; }
      // prefer higher tiles a bit, so stacks don't strand a lone tile
      free.sort((a, b) => P[b].z - P[a].z + (Math.random() - .5) * 2.2);
      const a = free[0]; const rest = free.slice(1); const b = rest[rnd(rest.length)];
      const [fa, fb] = Math.random() < .5 ? ps[k] : [ps[k][1], ps[k][0]];
      faces[a] = fa; faces[b] = fb; pr[a] = pr[b] = false;
    }
    if (ok) return faces;
  }
  return null;
}

// ---------- Tile faces (SVG, viewBox 60x80) ----------
const CN = ['','一','二','三','四','五','六','七','八','九'];
const dot = (x, y, r, c) => `<circle cx="${x}" cy="${y}" r="${r}" class="${c}"/><circle cx="${x}" cy="${y}" r="${r*.64}" class="iv"/><circle cx="${x}" cy="${y}" r="${r*.32}" class="${c}"/>`;
const DOTS = {
  2: [[30,22,'g'],[30,58,'b']],
  3: [[14,16,'b'],[30,40,'r'],[46,64,'g']],
  4: [[17,22,'b'],[43,22,'g'],[17,58,'g'],[43,58,'b']],
  5: [[16,18,'b'],[44,18,'g'],[30,40,'r'],[16,62,'g'],[44,62,'b']],
  6: [[18,14,'g'],[42,14,'g'],[18,42,'r'],[42,42,'r'],[18,66,'r'],[42,66,'r']],
  7: [[12,11,'g'],[30,19,'g'],[48,27,'g'],[18,48,'r'],[42,48,'r'],[18,68,'r'],[42,68,'r']],
  8: [[18,10,'b'],[42,10,'b'],[18,30,'b'],[42,30,'b'],[18,50,'b'],[42,50,'b'],[18,70,'b'],[42,70,'b']],
  9: [[12,14,'b'],[30,14,'b'],[48,14,'b'],[12,40,'r'],[30,40,'r'],[48,40,'r'],[12,66,'g'],[30,66,'g'],[48,66,'g']],
};
const DOTR = {2:13,3:11,4:11,5:10,6:10,7:8.2,8:8.5,9:8.2};
const stick = (x, y, h, c) => `<rect x="${x-3.4}" y="${y-h/2}" width="6.8" height="${h}" rx="3.2" class="${c}"/><rect x="${x-3.4}" y="${y-.9}" width="6.8" height="1.8" class="iv"/><rect x="${x-1}" y="${y-h/2+2}" width="2" height="${h-4}" rx="1" class="iv" opacity=".35"/>`;
const BAMS = {
  2: [[30,22,'b'],[30,58,'g']].map(a => [...a, 28]),
  3: [[30,22,'b'],[19,58,'g'],[41,58,'g']].map(a => [...a, 28]),
  4: [[19,22,'b'],[41,22,'g'],[19,58,'g'],[41,58,'b']].map(a => [...a, 28]),
  5: [[15,22,'g'],[45,22,'b'],[30,40,'r'],[15,58,'b'],[45,58,'g']].map(a => [...a, 28]),
  6: [[15,22,'g'],[30,22,'g'],[45,22,'g'],[15,58,'b'],[30,58,'b'],[45,58,'b']].map(a => [...a, 28]),
  7: [[30,13,'r',20],[15,41,'g',22],[30,41,'g',22],[45,41,'g',22],[15,67,'g',22],[30,67,'g',22],[45,67,'g',22]],
  8: [[12,22,'g'],[24,22,'g'],[36,22,'g'],[48,22,'g'],[12,58,'b'],[24,58,'b'],[36,58,'b'],[48,58,'b']].map(a => [...a, 28]),
  9: [[15,14,'g'],[30,14,'r'],[45,14,'b'],[15,40,'g'],[30,40,'r'],[45,40,'b'],[15,66,'g'],[30,66,'r'],[45,66,'b']].map(a => [...a, 22]),
};
const corner = t => `<text x="2" y="10" font-size="10" class="ix k">${t}</text>`;
const glyph = (ch, cls, y = 56, size = 48) => `<text x="30" y="${y}" font-size="${size}" text-anchor="middle" class="gl ${cls}">${ch}</text>`;
const FACE_CACHE = {};
function faceSVG(f) {
  if (FACE_CACHE[f]) return FACE_CACHE[f];
  let s = '';
  const t = f[0], n = +f[1];
  if (/^d\d$/.test(f)) {
    if (n === 1) s = `<circle cx="30" cy="40" r="25" class="g"/><circle cx="30" cy="40" r="20" class="iv"/><circle cx="30" cy="40" r="16" class="r"/><circle cx="30" cy="40" r="11" class="iv"/><circle cx="30" cy="40" r="5" class="b"/>`;
    else s = DOTS[n].map(([x,y,c]) => dot(x, y, DOTR[n], c)).join('');
  } else if (t === 'b') {
    if (n === 1) s = `<rect x="24" y="8" width="12" height="64" rx="6" class="g"/><rect x="24" y="27" width="12" height="3" class="iv"/><rect x="24" y="49" width="12" height="3" class="iv"/><path d="M36 30 C48 22 54 26 56 18 C48 20 42 22 36 28Z" class="g"/><path d="M24 50 C12 44 6 48 4 40 C12 42 18 44 24 48Z" class="g"/><circle cx="30" cy="16" r="3" class="r"/>`;
    else s = BAMS[n].map(([x,y,c,h]) => stick(x, y, h, c)).join('');
  } else if (t === 'c') {
    s = corner(n) + glyph(CN[n], 'b', 36, 30) + glyph('万', 'r', 72, 32);
  } else if (t === 'w') {
    const m = {E:['东','В'], S:['南','Ю'], W:['西','З'], N:['北','С']}[f[1]];
    s = corner(m[1]) + glyph(m[0], 'k');
  } else if (f === 'dr') s = glyph('中', 'r', 58, 52);
  else if (f === 'dg') s = glyph('发', 'g', 58, 52);
  else if (f === 'dw') s = `<rect x="9" y="11" width="42" height="58" rx="3" fill="none" stroke="var(--t-blue)" stroke-width="3.5"/><rect x="15" y="17" width="30" height="46" rx="2" fill="none" stroke="var(--t-blue)" stroke-width="1.6"/>`;
  else if (t === 'f') s = corner(n) + glyph('梅兰菊竹'[n-1], 'r', 58, 42) + `<circle cx="51" cy="8" r="4" class="r"/><circle cx="51" cy="8" r="1.6" class="iv"/>`;
  else if (t === 's') s = corner(n) + glyph('春夏秋冬'[n-1], 'b', 58, 42) + `<rect x="47" y="4" width="8" height="8" rx="1.5" class="b"/>`;
  return FACE_CACHE[f] = `<svg viewBox="0 0 60 80" aria-hidden="true">${s}</svg>`;
}
const NAMES = f => {
  const t = f[0], n = f[1];
  if (/^d\d$/.test(f)) return n + ' круг';
  if (t === 'b') return n + ' бамбук';
  if (t === 'c') return n + ' символ';
  if (t === 'w') return 'ветер ' + ({E:'восток',S:'юг',W:'запад',N:'север'}[n]);
  if (f === 'dr') return 'красный дракон'; if (f === 'dg') return 'зелёный дракон'; if (f === 'dw') return 'белый дракон';
  if (t === 'f') return 'цветок'; return 'сезон';
};

// ---------- State ----------
const KEY = 'mahjong-turtle-v1', BEST = 'mahjong-turtle-best';
let S; // {faces, present, history, elapsed, started, won}
let runStart = 0, selected = -1;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
let prefs = { dim: true };
try { prefs = Object.assign(prefs, JSON.parse(store.get('mahjong-prefs') || '{}')); } catch (e) {}

function newGame() {
  const faces = deal([...Array(N).keys()], fullPairs());
  S = { faces: [...Array(N).keys()].map(i => faces[i]), present: new Array(N).fill(true), history: [], elapsed: 0, started: false, won: false };
  selected = -1; runStart = 0;
  build(); save(); closeOverlay();
}
function save() {
  const s = Object.assign({}, S, { elapsed: elapsed() });
  store.set(KEY, JSON.stringify(s));
}
function load() {
  try {
    const s = JSON.parse(store.get(KEY));
    if (s && s.faces && s.faces.length === N && !s.won) { S = s; return true; }
  } catch (e) {}
  return false;
}
const running = () => S.started && !S.won && !document.hidden;
const elapsed = () => S.elapsed + (runStart ? Date.now() - runStart : 0);
function startClock() { if (!runStart && running()) runStart = Date.now(); }
function stopClock() { if (runStart) { S.elapsed += Date.now() - runStart; runStart = 0; } }
const fmt = ms => { const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0'); };

// ---------- Rendering ----------
const board = document.getElementById('board'), main = document.getElementById('main');
let els = [];
function build() {
  board.innerHTML = '';
  els = P.map((p, i) => {
    const d = document.createElement('div');
    d.className = 'tile';
    d.dataset.i = i;
    d.innerHTML = faceSVG(S.faces[i]);
    d.setAttribute('role', 'button');
    d.setAttribute('aria-label', NAMES(S.faces[i]));
    d.style.zIndex = p.z * 1000 + p.y * 32 + p.x;
    if (!S.present[i]) d.classList.add('gone', 'out');
    board.appendChild(d);
    return d;
  });
  layout(); refresh();
}
function layout() {
  const W = main.clientWidth, H = main.clientHeight;
  const ratio = 1.32, depth = .16;
  const w = Math.max(14, Math.min(W / (15 + 5 * depth + .3), H / (8 * ratio + 5 * depth + .3)));
  const h = w * ratio, d = w * depth, pad = 4 * d;
  board.style.width = (15 * w + pad + d * 1.5) + 'px';
  board.style.height = (8 * h + pad + d * 1.5) + 'px';
  board.style.setProperty('--w', w + 'px');
  board.style.setProperty('--d', d + 'px');
  els.forEach((el, i) => {
    const p = P[i];
    el.style.left = (pad + p.x * w / 2 - p.z * d) + 'px';
    el.style.top = (pad + p.y * h / 2 - p.z * d) + 'px';
    el.style.width = (w - 1.5) + 'px';
    el.style.height = (h - 1.5) + 'px';
  });
}
function freeMatches() {
  const byG = {};
  for (let i = 0; i < N; i++) if (isFree(i, S.present)) (byG[group(S.faces[i])] ||= []).push(i);
  return byG;
}
function refresh() {
  const left = S.present.filter(Boolean).length;
  let moves = 0;
  const byG = freeMatches();
  Object.values(byG).forEach(a => moves += a.length * (a.length - 1) / 2);
  els.forEach((el, i) => el.classList.toggle('blocked', S.present[i] && !isFree(i, S.present)));
  document.getElementById('sLeft').textContent = left;
  document.getElementById('sMoves').textContent = moves;
  document.getElementById('bUndo').disabled = !S.history.length;
  document.body.classList.toggle('dim', prefs.dim);
  const bd = document.getElementById('bDim'); bd.setAttribute('aria-pressed', prefs.dim);
  const best = +store.get(BEST) || 0;
  document.getElementById('sBest').textContent = best ? fmt(best) : '—';
  tick();
  showBanner(left > 0 && moves === 0);
  if (left === 0 && !S.won) win();
}
function tick() { document.getElementById('sTime').textContent = fmt(elapsed()); }
setInterval(() => { if (runStart) tick(); }, 1000);

// ---------- Play ----------
function clearHints() { els.forEach(e => e.classList.remove('hint')); }
function select(i) {
  if (selected >= 0) els[selected].classList.remove('sel');
  selected = i;
  if (i >= 0) els[i].classList.add('sel');
}
board.addEventListener('click', e => {
  const el = e.target.closest('.tile'); if (!el || S.won) return;
  const i = +el.dataset.i;
  if (!S.present[i]) return;
  clearHints();
  if (!isFree(i, S.present)) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); return; }
  if (selected === i) { select(-1); return; }
  if (selected >= 0 && group(S.faces[selected]) === group(S.faces[i])) {
    const a = selected; select(-1); remove(a, i); return;
  }
  select(i);
});
function remove(a, b) {
  if (!S.started) { S.started = true; startClock(); }
  S.present[a] = S.present[b] = false;
  S.history.push([a, b]);
  [a, b].forEach(k => { els[k].classList.add('gone'); setTimeout(() => { if (!S.present[k]) els[k].classList.add('out'); }, 230); });
  refresh(); save();
}
function undo() {
  const last = S.history.pop(); if (!last || S.won) { if (last) S.history.push(last); return; }
  select(-1); clearHints();
  last.forEach(k => { S.present[k] = true; els[k].classList.remove('out'); void els[k].offsetWidth; els[k].classList.remove('gone'); });
  refresh(); save();
}
function hint() {
  clearHints(); select(-1);
  const pair = Object.values(freeMatches()).find(a => a.length >= 2);
  if (!pair) return;
  pair.slice(0, 2).forEach(k => { void els[k].offsetWidth; els[k].classList.add('hint'); });
}
function reshuffle() {
  const idx = [...Array(N).keys()].filter(i => S.present[i]);
  if (!idx.length) return;
  const byG = {};
  idx.forEach(i => (byG[group(S.faces[i])] ||= []).push(S.faces[i]));
  const pairs = [];
  Object.values(byG).forEach(a => { for (let k = 0; k + 1 < a.length; k += 2) pairs.push([a[k], a[k+1]]); });
  const faces = deal(idx, pairs);
  if (!faces) return;
  idx.forEach(i => { S.faces[i] = faces[i]; els[i].innerHTML = faceSVG(faces[i]); els[i].setAttribute('aria-label', NAMES(faces[i])); });
  S.history = []; select(-1); clearHints();
  board.animate?.([{ opacity: .4 }, { opacity: 1 }], { duration: 300 });
  refresh(); save();
}

// ---------- Banners / overlay ----------
let bannerEl = null;
function showBanner(on) {
  if (!on) { bannerEl?.remove(); bannerEl = null; return; }
  if (bannerEl) return;
  bannerEl = document.createElement('div');
  bannerEl.className = 'banner';
  bannerEl.innerHTML = `<span>Свободных пар больше нет.</span><button class="primary" id="bbShuffle">Перемешать</button><button id="bbUndo">Отменить ход</button>`;
  main.appendChild(bannerEl);
  bannerEl.querySelector('#bbShuffle').onclick = reshuffle;
  bannerEl.querySelector('#bbUndo').onclick = undo;
}
let overlay = null;
function closeOverlay() { overlay?.remove(); overlay = null; }
function win() {
  stopClock(); S.won = true;
  const t = S.elapsed, best = +store.get(BEST) || 0, record = !best || t < best;
  if (record) store.set(BEST, t);
  save(); refresh();
  overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="card" role="dialog" aria-label="Победа"><div class="seal" style="margin:0 auto">麻</div>
    <h2>Поле очищено</h2><p class="big">${fmt(t)}</p>
    <p>${record ? 'Это новый рекорд!' : 'Рекорд: ' + fmt(best)}</p>
    <div class="row"><button class="primary" id="bAgain">Новая игра</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#bAgain').onclick = newGame;
  overlay.querySelector('#bAgain').focus();
}

// ---------- Controls ----------
document.getElementById('bHint').onclick = hint;
document.getElementById('bUndo').onclick = undo;
document.getElementById('bShuffle').onclick = reshuffle;
let confirmNew = 0;
const bNew = document.getElementById('bNew');
bNew.onclick = () => {
  const inProgress = S.history.length > 0 && !S.won;
  if (inProgress && Date.now() - confirmNew > 2500) { confirmNew = Date.now(); bNew.textContent = 'Точно? Нажмите ещё раз'; setTimeout(() => bNew.textContent = 'Новая игра', 2500); return; }
  bNew.textContent = 'Новая игра'; confirmNew = 0; newGame();
};
document.getElementById('bDim').onclick = () => { prefs.dim = !prefs.dim; store.set('mahjong-prefs', JSON.stringify(prefs)); refresh(); };
document.addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H' || e.key === 'р' || e.key === 'Р') hint();
  else if ((e.key === 'z' || e.key === 'Z' || e.key === 'я' || e.key === 'Я')) { e.preventDefault(); undo(); }
  else if (e.key === 'Escape') select(-1);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { stopClock(); save(); } else startClock(); });
window.addEventListener('pagehide', save);
new ResizeObserver(layout).observe(main);

if (load()) { build(); startClock(); } else newGame();
document.fonts?.ready.then(() => layout());
})();
</script>
</body>
